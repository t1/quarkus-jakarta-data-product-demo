name: Java CI

on:
  push:
  pull_request:
  schedule: [ cron: '19 12 * * 5' ]

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - name: Build
        run: mvn --batch-mode --show-version --no-transfer-progress -D CI=GitHub install
